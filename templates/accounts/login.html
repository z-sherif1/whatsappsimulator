
{% extends 'base.html' %}

{% block title %}
Login - ChatFlow
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="text-center mb-4">Login</h2>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-dark w-100">
                        Login
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
